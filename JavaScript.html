<script>
/**
 * HOSTEL 360 - JavaScript.html
 * Robust Vanilla JavaScript Client-Side Controller, State Manager & API Wrapper.
 */

var App = {
  token: null,
  currentUser: null,
  currentView: 'landing',
  studentData: null,
  wardenData: null,
  allotmentLetterData: null,
  currentTheme: 'light',

  /**
   * Initializes theme from localStorage or system preference
   */
  initTheme: function () {
    var savedTheme = localStorage.getItem('h360_theme');
    if (!savedTheme) {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        savedTheme = 'dark';
      } else {
        savedTheme = 'light';
      }
    }
    this.setTheme(savedTheme);
  },

  /**
   * Toggles between Dark and Light mode
   */
  toggleTheme: function () {
    var newTheme = (this.currentTheme === 'dark') ? 'light' : 'dark';
    this.setTheme(newTheme);
  },

  /**
   * Applies the theme and updates toggle button state
   */
  setTheme: function (theme) {
    this.currentTheme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('h360_theme', theme);

    var iconEl = document.getElementById('theme-toggle-icon');
    var textEl = document.getElementById('theme-toggle-text');
    if (iconEl && textEl) {
      if (theme === 'dark') {
        iconEl.textContent = '☀️';
        textEl.textContent = 'Light';
      } else {
        iconEl.textContent = '🌙';
        textEl.textContent = 'Dark';
      }
    }
  },

  /**
   * Initializes application state on DOM ready
   */
  init: function () {
    this.initTheme();
    this.token = sessionStorage.getItem('h360_token') || null;
    if (this.token) {
      this.verifySavedSession();
    } else {
      this.navigate('landing');
    }
  },

  /**
   * Generic Promise wrapper for google.script.run
   */
  callServer: function (functionName) {
    var args = Array.prototype.slice.call(arguments, 1);
    var self = this;

    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(function (response) {
          if (response && response.success) {
            resolve(response.data);
          } else {
            var errMsg = (response && response.error) ? response.error : 'An unexpected server error occurred.';
            self.showToast(errMsg, 'error');
            reject(new Error(errMsg));
          }
        })
        .withFailureHandler(function (err) {
          var msg = err.message || 'Network communication error.';
          self.showToast(msg, 'error');
          reject(err);
        });

      runner[functionName].apply(runner, args);
    });
  },

  /**
   * Verifies existing token on page reload
   */
  verifySavedSession: function () {
    var self = this;
    this.showLoading('Verifying session...');
    this.callServer('apiVerifySession', this.token)
      .then(function (session) {
        self.currentUser = session;
        self.hideLoading();
        if (session.role === 'WARDEN') {
          self.navigate('warden-dashboard');
        } else if (session.role === 'STUDENT') {
          self.navigate('student-dashboard');
        } else {
          self.logout();
        }
      })
      .catch(function () {
        self.hideLoading();
        self.logout();
      });
  },

  /**
   * View router
   */
  navigate: function (viewName) {
    this.currentView = viewName;
    var views = document.querySelectorAll('.view-container');
    views.forEach(function (v) { v.style.display = 'none'; });

    var target = document.getElementById('view-' + viewName);
    if (target) {
      target.style.display = 'block';
    }

    this.updateNavbar();

    if (viewName === 'student-dashboard') {
      this.loadStudentDashboard();
    } else if (viewName === 'warden-dashboard') {
      this.loadWardenDashboard();
    }
  },

  /**
   * Updates navbar UI state based on session
   */
  updateNavbar: function () {
    var userBadge = document.getElementById('nav-user-badge');
    var logoutBtn = document.getElementById('nav-logout-btn');

    if (this.currentUser) {
      userBadge.style.display = 'flex';
      logoutBtn.style.display = 'inline-flex';
      document.getElementById('nav-user-name').textContent = this.currentUser.name || this.currentUser.email;
      var rolePill = document.getElementById('nav-user-role');
      rolePill.textContent = this.currentUser.role;
      rolePill.className = 'role-pill ' + this.currentUser.role.toLowerCase();
    } else {
      userBadge.style.display = 'none';
      logoutBtn.style.display = 'none';
    }
  },

  /**
   * Login action
   */
  login: function (email, password) {
    var self = this;
    if (!email || !password) {
      this.showToast('Please enter both email and password.', 'warning');
      return;
    }

    this.showLoading('Authenticating...');
    this.callServer('apiLogin', email, password)
      .then(function (session) {
        self.token = session.token;
        self.currentUser = session.user;
        sessionStorage.setItem('h360_token', session.token);
        self.hideLoading();
        self.showToast('Login successful. Welcome, ' + (session.user.name || session.user.email), 'success');

        if (session.user.role === 'WARDEN') {
          self.navigate('warden-dashboard');
        } else {
          self.navigate('student-dashboard');
        }
      })
      .catch(function () {
        self.hideLoading();
      });
  },

  /**
   * Quick Demo Login helper
   */
  demoLogin: function (role) {
    if (role === 'STUDENT') {
      this.login('student.demo@hostel360.test', 'Student@123');
    } else if (role === 'WARDEN') {
      this.login('warden.demo@hostel360.test', 'Warden@123');
    }
  },

  /**
   * Logout action
   */
  logout: function () {
    var self = this;
    if (this.token) {
      this.callServer('apiLogout', this.token).catch(function () {});
    }
    this.token = null;
    this.currentUser = null;
    sessionStorage.removeItem('h360_token');
    this.navigate('landing');
    this.showToast('Logged out successfully.', 'info');
  },

  // ============================================================
  // STUDENT DASHBOARD CONTROLLERS
  // ============================================================

  loadStudentDashboard: function () {
    var self = this;
    if (!this.token) {
      this.navigate('landing');
      return;
    }
    this.showLoading('Loading student portal...');
    this.callServer('apiGetStudentDashboard', this.token)
      .then(function (data) {
        self.studentData = data;
        self.hideLoading();
        self.renderStudentDashboard(data);
      })
      .catch(function (err) {
        self.hideLoading();
        if (err && err.message && (err.message.indexOf('Unauthorized') !== -1 || err.message.indexOf('session') !== -1 || err.message.indexOf('Session') !== -1)) {
          self.logout();
        }
      });
  },

  renderStudentDashboard: function (data) {
    var self = this;
    // 1. Profile Header
    var student = data.student || {};
    document.getElementById('stu-display-name').textContent = student.Name || (self.currentUser ? self.currentUser.name : '') || 'Student';
    document.getElementById('stu-display-enrollment').textContent = student.EnrollmentNo || 'Pending Submission';
    document.getElementById('stu-display-programme').textContent = student.Programme || 'N/A';
    document.getElementById('stu-display-category').textContent = student.Category || 'GENERAL';

    // 2. Timeline Step Rendering (8 Stages)
    var step = 1;

    // Check if an application has actually been submitted:
    var hasSubmittedApp = data.application && data.application.ApplicationID &&
      (data.application.Status === 'SUBMITTED' || data.application.Status === 'VERIFIED');

    if (!hasSubmittedApp) {
      // Stage 1: Application submission pending (active circle 1, no green ticks)
      step = 1;
    } else {
      // Application IS submitted -> At least Stage 2 (Submitted shows green tick ✓)
      step = 2;

      // Check if Eligibility is determined
      if (data.application.EligibilityStatus === 'ELIGIBLE') {
        step = 3; // Eligibility confirmed (✓), Stage 3 Doc Verification active

        // Check if all category-required documents are verified:
        var requiredDocList = data.requiredDocs || data.mandatoryDocs || [];
        if (data.documents && requiredDocList.length > 0) {
          var dMap = {};
          data.documents.forEach(function (d) { dMap[d.DocumentType] = d; });
          var allVerified = requiredDocList.every(function (dt) {
            return dMap[dt] && String(dMap[dt].VerificationStatus).toUpperCase() === 'VERIFIED';
          });
          // If all required documents are verified for a submitted application, Step 3 (Doc Verification) is completed (✓)
          if (allVerified) {
            step = 4; // Advances to Step 4 (Allocation), so Steps 1, 2, 3 show green ticks ✓
          }
        }
      }

      // Check for Draft Allocation in review
      if (data.analytics && data.analytics.timelineStep >= 5) {
        step = data.analytics.timelineStep;
      }

      // Check for Published Allocation / Fee Payment / Physical Registration
      if (data.allocation && data.allocation.status === 'PUBLISHED') {
        var isRegistered = (data.allocation.registrationStatus === 'COMPLETED');
        var hasVerifiedPayment = (data.payments || []).some(function (p) { return p.Status === 'VERIFIED'; });

        if (isRegistered) {
          step = 9; // All 8 stages completed with green checkmarks ✓!
        } else if (hasVerifiedPayment) {
          step = 8; // Fee verified -> Stage 8: Physical Registration & Key Handover active
        } else {
          step = 7; // Published -> Stage 7: Fee Payment active (3-day countdown)
        }
      }
    }

    var steps = document.querySelectorAll('#student-timeline .timeline-step');
    steps.forEach(function (el, idx) {
      var stepNum = idx + 1;
      el.classList.remove('completed', 'active');
      if (stepNum < step) el.classList.add('completed');
      else if (stepNum === step) el.classList.add('active');
    });

    // 3. Populate Application Form fields if previously submitted
    if (student.StudentID) {
      document.getElementById('app-name').value = student.Name || '';
      document.getElementById('app-enrollment').value = student.EnrollmentNo || '';
      document.getElementById('app-dob').value = student.DateOfBirth ? String(student.DateOfBirth).split('T')[0] : '';
      document.getElementById('app-gender').value = student.Gender || '';
      document.getElementById('app-nationality').value = student.Nationality || 'INDIAN';
      document.getElementById('app-programme').value = student.Programme || '';
      document.getElementById('app-department').value = student.Department || '';
      document.getElementById('app-joining-date').value = student.JoiningDate ? String(student.JoiningDate).split('T')[0] : '';
      document.getElementById('app-category').value = student.Category || 'GENERAL';
      document.getElementById('app-region-type').value = student.RegionType || 'OUTSIDE_DELHI';
      document.getElementById('app-ncr-resident').checked = (student.IsDelhiNCRResident === true || student.IsDelhiNCRResident === 'true');
      document.getElementById('app-parent-posted-outside').checked = (student.IsParentPostedOutsideNCR === true || student.IsParentPostedOutsideNCR === 'true');
      document.getElementById('app-pwd').checked = (student.IsPwD === true || student.IsPwD === 'true');
      document.getElementById('app-mobile').value = student.StudentMobile || '';
      document.getElementById('app-parent-name').value = student.ParentName || '';
      document.getElementById('app-parent-mobile').value = student.ParentMobile || '';
      document.getElementById('app-address').value = student.PermanentAddress || '';
      document.getElementById('app-city').value = student.PermanentCity || '';
      document.getElementById('app-state').value = student.PermanentState || '';
      document.getElementById('app-pincode').value = student.PermanentPincode || '';
      document.getElementById('app-guardian-name').value = student.LocalGuardianName || '';
      document.getElementById('app-guardian-contact').value = student.LocalGuardianContact || '';
      document.getElementById('app-emergency-contact').value = student.EmergencyContact || '';
    }

    // Populate Hostel Preferences Select Options filtered strictly by gender
    var stuGender = student.Gender || (document.getElementById('app-gender') ? document.getElementById('app-gender').value : '') || 'MALE';
    var initP1 = data.application ? data.application.FirstHostelPref : '';
    var initP2 = data.application ? data.application.SecondHostelPref : '';
    this.renderHostelPreferenceOptions(stuGender, initP1, initP2, data.hostelsList);

    var noPrefCheck = document.getElementById('app-no-pref');
    if (data.application) {
      if (noPrefCheck) {
        noPrefCheck.checked = (data.application.NoPreference === true || data.application.NoPreference === 'true');
        this.toggleNoPreference(noPrefCheck.checked);
      }
    }

    // 4. Render Allocation Card & Allotment Letter Button
    var allocContainer = document.getElementById('stu-allocation-card-container');
    var letterBtn = document.getElementById('stu-btn-view-letter');

    if (data.allocation && data.allocation.status === 'PUBLISHED') {
      if (letterBtn) letterBtn.style.display = 'inline-flex';
      var isRegistered = (data.allocation.registrationStatus === 'COMPLETED');
      var isOverdue = data.allocation.isOverdue;
      var hoursRem = data.allocation.hoursRemaining || 0;
      var daysRem = data.allocation.daysRemaining || 0;

      var regBadge = '';
      if (isRegistered) {
        regBadge = '<span class="badge badge-success" style="font-size:12px; margin-left:6px;">✓ REGISTRATION COMPLETED</span>';
      } else if (isOverdue) {
        regBadge = '<span class="badge badge-danger" style="font-size:12px; margin-left:6px;">🔴 DEADLINE EXPIRED (OVERDUE)</span>';
      } else {
        regBadge = '<span class="badge badge-warning" style="font-size:12px; margin-left:6px;">⏳ ' + daysRem + 'd (' + hoursRem + 'h) REMAINING</span>';
      }

      var regNotice = '';
      if (isRegistered) {
        regNotice =
          '<div style="background:rgba(16,185,129,0.2); border:1px solid var(--success); color:#ffffff; padding:12px 16px; border-radius:6px; margin-top:14px; font-size:13px;">' +
          '🎉 <strong>Physical Registration & Key Handover Complete!</strong> You have officially taken possession of your single-occupancy room.' +
          '</div>';
      } else if (isOverdue) {
        regNotice =
          '<div style="background:rgba(239,68,68,0.25); border:1px solid var(--danger); color:#ffffff; padding:12px 16px; border-radius:6px; margin-top:14px; font-size:13px;">' +
          '⚠️ <strong>Fee & Reporting Deadline Expired:</strong> Your fee submission deadline has elapsed. Please complete your fee payment/DD submission immediately, or this seat will be forfeited and reallocated to waitlisted candidates.' +
          '</div>';
      } else {
        regNotice =
          '<div style="background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); color:#ffffff; padding:12px 16px; border-radius:6px; margin-top:14px; font-size:13px;">' +
          '📌 <strong>Fee & Reporting Deadline:</strong> Please deposit your fee/DD details within <strong>' + daysRem + ' days (' + hoursRem + ' hours)</strong> and visit the Warden Office with your printed Allotment Letter for physical check-in.' +
          '</div>';
      }

      allocContainer.innerHTML =
        '<div class="allocation-spotlight">' +
        '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">' +
        '<span class="spotlight-badge">OFFICIALLY ALLOTTED • SINGLE OCCUPANCY</span>' +
        regBadge +
        '</div>' +
        '<div class="spotlight-room">Room ' + data.allocation.roomNumber + ' (Floor ' + data.allocation.floorNumber + ')</div>' +
        '<div class="spotlight-hostel">' + data.allocation.hostelName + ' (' + data.allocation.hostelCode + ')</div>' +
        '<div style="font-size:13px; opacity:0.9;">Allotment Date: ' + data.allocation.allocatedDate + ' | Tier: ' + data.allocation.priorityGroup + '</div>' +
        '<div class="spotlight-explanation"><strong>Official Decision Explanation:</strong><br>' + data.allocation.explanation + '</div>' +
        regNotice +
        '<div style="margin-top:16px; display:flex; gap:10px;">' +
        '<button class="btn btn-secondary btn-sm" onclick="App.openAllotmentLetterModal()">📄 View Digital Allotment Letter</button>' +
        '</div>' +
        '</div>';
    } else if (data.waitlist) {
      if (letterBtn) letterBtn.style.display = 'none';
      allocContainer.innerHTML =
        '<div class="card" style="border-left: 5px solid var(--warning);">' +
        '<div style="display:flex; justify-content:space-between; align-items:center;">' +
        '<h3 style="color:var(--warning);">Status: Waitlisted (Position #' + data.waitlist.position + ')</h3>' +
        '<span class="badge badge-warning">WAITLISTED</span>' +
        '</div>' +
        '<p style="font-size:13px; margin:10px 0; color:var(--text-muted);">' + data.waitlist.explanation + '</p>' +
        '</div>';
    } else if (!hasSubmittedApp) {
      if (letterBtn) letterBtn.style.display = 'none';
      allocContainer.innerHTML =
        '<div class="card" style="text-align:center; padding:28px 20px; border:2px dashed var(--primary); background:rgba(37,99,235,0.03);">' +
        '<div style="font-size:32px; margin-bottom:8px;">📝</div>' +
        '<h4 style="color:var(--text-main); margin-bottom:6px;">Stage 1: Application Submission Pending</h4>' +
        '<p style="font-size:13px; color:var(--text-muted); max-width:550px; margin:0 auto 16px auto;">Please review your student profile details, select your preferred hostels in the form below, and click <strong>Submit Application</strong> to begin your allotment lifecycle.</p>' +
        '<button type="button" class="btn btn-primary btn-sm" onclick="App.switchStudentTab(\'application\'); document.getElementById(\'app-pref-1\').focus();">Proceed to Application Form ↓</button>' +
        '</div>';
    } else {
      if (letterBtn) letterBtn.style.display = 'none';
      allocContainer.innerHTML =
        '<div class="card" style="text-align:center; padding:30px; color:var(--text-muted);">' +
        '<div style="font-size:32px; margin-bottom:8px;">⏳</div>' +
        '<h4 style="color:var(--text-main);">Allocation Not Yet Published</h4>' +
        '<p style="font-size:13px; margin-top:4px;">Official single-occupancy room allotments are undergoing administrative review and will be published shortly.</p>' +
        '</div>';
    }

    // 5. Render Documents List
    this.renderStudentDocumentsTable(data.documents, data.requiredDocs || data.mandatoryDocs, data.student);

    // 6. Render Payments List & Dynamic Lock/Unlock state
    var isRoomAllocated = (data.allocation && data.allocation.status === 'PUBLISHED');
    var lockedBanner = document.getElementById('stu-payment-locked-banner');
    var activeContainer = document.getElementById('stu-payment-active-container');
    if (lockedBanner && activeContainer) {
      if (isRoomAllocated) {
        lockedBanner.style.display = 'none';
        activeContainer.style.display = 'block';
      } else {
        lockedBanner.style.display = 'block';
        activeContainer.style.display = 'none';
      }
    }
    this.renderStudentPaymentsTable(data.payments, data.feeAmount);
  },

  switchStudentTab: function (tabName) {
    var tabs = document.querySelectorAll('.student-tab');
    var btns = document.querySelectorAll('#view-student-dashboard .tab-btn');
    tabs.forEach(function (t) { t.classList.remove('active'); });
    btns.forEach(function (b) { b.classList.remove('active'); });

    var targetTab = document.getElementById('stu-tab-' + tabName);
    var targetBtn = document.getElementById('btn-stu-tab-' + tabName);
    if (targetTab) targetTab.classList.add('active');
    if (targetBtn) targetBtn.classList.add('active');
  },

  onGenderChange: function (gender) {
    var p1 = document.getElementById('app-pref-1') ? document.getElementById('app-pref-1').value : '';
    var p2 = document.getElementById('app-pref-2') ? document.getElementById('app-pref-2').value : '';
    this.renderHostelPreferenceOptions(gender, p1, p2);
  },

  renderHostelPreferenceOptions: function (gender, selectedP1, selectedP2, customHostList) {
    var hostList = customHostList || (this.studentData && this.studentData.hostelsList) || [];
    var p1Select = document.getElementById('app-pref-1');
    var p2Select = document.getElementById('app-pref-2');
    if (!p1Select || !p2Select) return;

    var normalizedGender = String(gender || '').toUpperCase().trim();
    var filteredHostels = hostList.filter(function (h) {
      if (!normalizedGender) return true;
      var hGender = String(h.Gender || '').toUpperCase().trim();
      if (normalizedGender === 'MALE' || normalizedGender === 'BOYS') {
        return hGender === 'BOYS' || hGender === 'MALE';
      }
      if (normalizedGender === 'FEMALE' || normalizedGender === 'GIRLS') {
        return hGender === 'GIRLS' || hGender === 'FEMALE';
      }
      return hGender === normalizedGender;
    });

    p1Select.innerHTML = '<option value="">-- Select Preferred Hostel --</option>';
    p2Select.innerHTML = '<option value="">-- Select Second Preference --</option>';

    filteredHostels.forEach(function (h) {
      p1Select.innerHTML += '<option value="' + h.HostelID + '">' + h.Name + ' (' + h.Code + ' - ' + h.Gender + ')</option>';
      p2Select.innerHTML += '<option value="' + h.HostelID + '">' + h.Name + ' (' + h.Code + ' - ' + h.Gender + ')</option>';
    });

    // Populate or auto-select compatible preferences
    if (selectedP1 && filteredHostels.some(function(h){ return h.HostelID === selectedP1; })) {
      p1Select.value = selectedP1;
    } else if (filteredHostels.length > 0) {
      p1Select.value = filteredHostels[0].HostelID;
    }

    if (selectedP2 && filteredHostels.some(function(h){ return h.HostelID === selectedP2; })) {
      p2Select.value = selectedP2;
    } else if (filteredHostels.length > 1) {
      p2Select.value = filteredHostels[1].HostelID;
    }
  },

  toggleNoPreference: function (isNoPref) {
    var p1 = document.getElementById('app-pref-1');
    var p2 = document.getElementById('app-pref-2');
    if (isNoPref) {
      p1.disabled = true;
      p2.disabled = true;
      p1.value = '';
      p2.value = '';
    } else {
      p1.disabled = false;
      p2.disabled = false;
    }
  },

  getDocumentDisplayName: function (dt) {
    var labels = {
      'ADMISSION_FEE_RECEIPT': 'ADMISSION FEE RECEIPT',
      'MEDICAL_FITNESS': 'MEDICAL FITNESS',
      'PERMANENT_ADDRESS_PROOF': 'PERMANENT ADDRESS PROOF',
      'PARENT_UNDERTAKING': 'PARENT UNDERTAKING',
      'STUDENT_UNDERTAKING': 'STUDENT UNDERTAKING',
      'SC_CERTIFICATE': 'SC CASTE CERTIFICATE',
      'ST_CERTIFICATE': 'ST TRIBE CERTIFICATE',
      'OBC_NCL_CERTIFICATE': 'OBC NCL CERTIFICATE',
      'EWS_CERTIFICATE': 'EWS INCOME & ASSET CERTIFICATE',
      'PWD_CERTIFICATE': 'PWD CERTIFICATE',
      'PASSPORT_AND_VISA': 'PASSPORT & VISA',
      'PARENT_POSTING_CERTIFICATE': 'PARENT POSTING OUTSIDE NCR'
    };
    return labels[dt] || dt.replace(/_/g, ' ');
  },

  renderStudentDocumentsTable: function (documents, requiredDocs, student) {
    var tbody = document.getElementById('stu-docs-tbody');
    if (!tbody) return;
    tbody.innerHTML = '';
    var docMap = {};
    (documents || []).forEach(function (d) { docMap[d.DocumentType] = d; });

    // Determine category-specific required documents strictly per Hostel Brochure
    var allTypes = [];
    if (requiredDocs && requiredDocs.length > 0) {
      allTypes = requiredDocs.slice();
    } else {
      allTypes = ['ADMISSION_FEE_RECEIPT', 'MEDICAL_FITNESS', 'PERMANENT_ADDRESS_PROOF', 'PARENT_UNDERTAKING', 'STUDENT_UNDERTAKING'];
      if (student) {
        var cat = String(student.Category || '').toUpperCase().trim();
        var isPwd = (student.IsPwD === true || student.IsPwD === 'true' || student.IsPwD === 'YES' || cat === 'PWD');
        var isForeign = (cat === 'FOREIGN' || (student.Nationality && String(student.Nationality).toUpperCase().trim() !== 'INDIAN'));
        var isParentOutside = (student.IsParentPostedOutsideNCR === true || student.IsParentPostedOutsideNCR === 'true' || student.IsParentPostedOutsideNCR === 'YES');
        if (isPwd) allTypes.push('PWD_CERTIFICATE');
        if (cat === 'SC') allTypes.push('SC_CERTIFICATE');
        if (cat === 'ST') allTypes.push('ST_CERTIFICATE');
        if (cat === 'OBC') allTypes.push('OBC_NCL_CERTIFICATE');
        if (cat === 'EWS') allTypes.push('EWS_CERTIFICATE');
        if (isForeign) allTypes.push('PASSPORT_AND_VISA');
        if (isParentOutside) allTypes.push('PARENT_POSTING_CERTIFICATE');
      }
    }

    var self = this;
    allTypes.forEach(function (dt) {
      var doc = docMap[dt];
      var statusBadge = '<span class="badge badge-secondary">NOT UPLOADED</span>';
      var actionBtn = '';

      if (doc) {
        if (doc.VerificationStatus === 'VERIFIED') statusBadge = '<span class="badge badge-success">VERIFIED</span>';
        else if (doc.VerificationStatus === 'REJECTED') statusBadge = '<span class="badge badge-danger">REJECTED</span>';
        else statusBadge = '<span class="badge badge-warning">PENDING REVIEW</span>';

        actionBtn = '<a href="' + doc.DriveURL + '" target="_blank" class="btn btn-sm btn-secondary">View File</a>';
      }

      var uploadInput = '<input type="file" id="upload_' + dt + '" style="display:none;" onchange="App.handleDocumentUpload(this, \'' + dt + '\')">' +
        '<button type="button" class="btn btn-sm btn-primary" onclick="document.getElementById(\'upload_' + dt + '\').click()">' + (doc ? 'Re-upload' : 'Upload') + '</button>';

      var displayName = self.getDocumentDisplayName(dt);

      var tr = document.createElement('tr');
      tr.innerHTML = '<td><strong>' + displayName + '</strong></td>' +
        '<td>' + statusBadge + '</td>' +
        '<td>' + (doc ? (doc.Remarks || 'Uploaded') : 'Mandatory') + '</td>' +
        '<td style="display:flex; gap:8px;">' + actionBtn + uploadInput + '</td>';
      tbody.appendChild(tr);
    });
  },

  handleDocumentUpload: function (inputEl, documentType) {
    var file = inputEl.files[0];
    if (!file) return;

    var self = this;
    if (file.size > 10 * 1024 * 1024) {
      this.showToast('File size must be under 10MB.', 'warning');
      return;
    }

    var reader = new FileReader();
    this.showLoading('Uploading document to Drive...');

    reader.onload = function (e) {
      var base64Data = e.target.result;
      self.callServer('apiUploadDocument', self.token, documentType, base64Data, file.name, file.type)
        .then(function (result) {
          self.hideLoading();
          self.showToast('Document uploaded successfully.', 'success');
          self.loadStudentDashboard();
        })
        .catch(function () {
          self.hideLoading();
        });
    };

    reader.readAsDataURL(file);
  },

    var amount = document.getElementById('pay-amount').value;
    var mode = document.getElementById('pay-mode').value;
    var date = document.getElementById('pay-date').value;

    var payload = {
      amount: amount,
      paymentMode: mode,
      paymentDate: date
    };

    if (mode === 'DEMAND_DRAFT') {
      var ddNum = (document.getElementById('pay-dd-number').value || '').trim();
      var ddBank = (document.getElementById('pay-dd-bank').value || '').trim();
      var ddBranch = (document.getElementById('pay-dd-branch').value || '').trim();

      if (!ddNum || !ddBank) {
        this.showToast('Please enter Demand Draft number and issuing bank name.', 'warning');
        return;

      payload.transactionReference = ddNum;
      payload.ddBankName = ddBank;
      payload.ddBranchName = ddBranch;
      payload.ddInFavorOf = ddPayee;
    } else {
      var ref = (document.getElementById('pay-ref').value || '').trim();
      if (!ref) {
        this.showToast('Please enter transaction reference / UTR / Challan number.', 'warning');

    if (!payload.paymentDate) {
      this.showToast('Please specify instrument / payment date.', 'warning');
      return;

    var self = this;
    this.showLoading('Recording ' + (mode === 'DEMAND_DRAFT' ? 'Demand Draft' : 'offline payment') + ' details...');

      .then(function (res) {

  escapeHtml: function (str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  },

  formatMarkdownInline: function (text) {
    if (!text) return '';
    // Bold: **text**
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // Italic: *text* (avoiding double stars)
    text = text.replace(/(^|[^\*])\*([^\*]+)\*([^\*]|$)/g, '$1<em>$2</em>$3');
    // Inline code: `text`
    text = text.replace(/`([^`]+)`/g, '<code class="smriti-md-code">$1</code>');
    return text;
  },

  renderMarkdown: function (md) {
    if (!md) return '';
    var safe = this.escapeHtml(md);

    var lines = safe.split(/\r?\n/);
    var out = [];
    var inUl = false;
    var inOl = false;
    var inCode = false;
    var codeBuf = [];
    var self = this;

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];

      // Code blocks ```
      if (line.trim().indexOf('```') === 0) {
        if (inCode) {
          out.push('<pre class="smriti-md-pre"><code>' + codeBuf.join('\n') + '</code></pre>');
          codeBuf = [];
          inCode = false;
        } else {
          if (inUl) { out.push('</ul>'); inUl = false; }
          if (inOl) { out.push('</ol>'); inOl = false; }
          inCode = true;
        }
        continue;
      }
      if (inCode) {
        codeBuf.push(line);
        continue;
      }

      var ulMatch = line.match(/^(\s*)[*-]\s+(.*)$/);
      var olMatch = line.match(/^(\s*)\d+\.\s+(.*)$/);
      var h3Match = line.match(/^###\s+(.*)$/);
      var h2Match = line.match(/^##\s+(.*)$/);
      var h1Match = line.match(/^#\s+(.*)$/);
      var bqMatch = line.match(/^>\s+(.*)$/);

      if (ulMatch) {
        if (inOl) { out.push('</ol>'); inOl = false; }
        if (!inUl) { out.push('<ul class="smriti-md-ul">'); inUl = true; }
        out.push('<li>' + self.formatMarkdownInline(ulMatch[2]) + '</li>');
        continue;
      } else if (inUl) {
        out.push('</ul>');
        inUl = false;
      }

      if (olMatch) {
        if (inUl) { out.push('</ul>'); inUl = false; }
        if (!inOl) { out.push('<ol class="smriti-md-ol">'); inOl = true; }
        out.push('<li>' + self.formatMarkdownInline(olMatch[2]) + '</li>');
        continue;
      } else if (inOl) {
        out.push('</ol>');
        inOl = false;
      }

      if (bqMatch) {
        out.push('<blockquote class="smriti-md-blockquote">' + self.formatMarkdownInline(bqMatch[1]) + '</blockquote>');
      } else if (h3Match) {
        out.push('<h4 class="smriti-md-h4">' + self.formatMarkdownInline(h3Match[1]) + '</h4>');
      } else if (h2Match) {
        out.push('<h3 class="smriti-md-h3">' + self.formatMarkdownInline(h2Match[1]) + '</h3>');
      } else if (h1Match) {
        out.push('<h2 class="smriti-md-h2">' + self.formatMarkdownInline(h1Match[1]) + '</h2>');
      } else if (line.trim() === '---' || line.trim() === '***') {
        out.push('<hr class="smriti-md-hr"/>');
      } else if (line.trim() === '') {
        if (out.length > 0 && out[out.length - 1] !== '<div class="smriti-md-gap"></div>') {
          out.push('<div class="smriti-md-gap"></div>');
        }
      } else {
        out.push('<p class="smriti-md-p">' + self.formatMarkdownInline(line) + '</p>');
      }
    }

    if (inCode) {
      out.push('<pre class="smriti-md-pre"><code>' + codeBuf.join('\n') + '</code></pre>');
    }
    if (inUl) out.push('</ul>');
    if (inOl) out.push('</ol>');

    return out.join('');
  },

  renderPaginationBar: function (containerId, currentPage, totalItems, pageSize, onPageChangeName) {
    var container = document.getElementById(containerId);
    if (!container) return;

    if (totalItems === 0) {
      container.innerHTML = '<div class="pagination-info">Showing <strong>0</strong> of <strong>0</strong> entries</div>';
      return;
    }

    var totalPages = Math.ceil(totalItems / pageSize) || 1;
    var startItem = (currentPage - 1) * pageSize + 1;
    var endItem = Math.min(currentPage * pageSize, totalItems);

    var infoHtml = '<div class="pagination-info">' +
      'Showing <strong>' + startItem + '</strong> to <strong>' + endItem + '</strong> of <strong>' + totalItems + '</strong> entries' +
      '</div>';

    var controlsHtml = '<div class="pagination-controls">';

    var prevDisabled = currentPage <= 1 ? 'disabled' : '';
    controlsHtml += '<button class="page-btn" ' + prevDisabled + ' onclick="' + onPageChangeName + '(' + (currentPage - 1) + ')" title="Previous Page">‹ Prev</button>';

    var pages = [];
    if (totalPages <= 7) {
      for (var i = 1; i <= totalPages; i++) pages.push(i);
    } else {
      if (currentPage <= 4) {
        pages = [1, 2, 3, 4, 5, '...', totalPages];
      } else if (currentPage >= totalPages - 3) {
        pages = [1, '...', totalPages - 4, totalPages - 3, totalPages - 2, totalPages - 1, totalPages];
      } else {
        pages = [1, '...', currentPage - 1, currentPage, currentPage + 1, '...', totalPages];
      }
    }

    for (var j = 0; j < pages.length; j++) {
      var p = pages[j];
      if (p === '...') {
        controlsHtml += '<span class="page-ellipsis">…</span>';
      } else if (p === currentPage) {
        controlsHtml += '<button class="page-btn active" disabled>' + p + '</button>';
      } else {
        controlsHtml += '<button class="page-btn" onclick="' + onPageChangeName + '(' + p + ')">' + p + '</button>';
      }
    }

    var nextDisabled = currentPage >= totalPages ? 'disabled' : '';
    controlsHtml += '<button class="page-btn" ' + nextDisabled + ' onclick="' + onPageChangeName + '(' + (currentPage + 1) + ')" title="Next Page">Next ›</button>';

    controlsHtml += '</div>';

    container.innerHTML = infoHtml + controlsHtml;
  },

  pendingPaymentVerifications: {},

  renderWardenPaymentsTable: function (payments) {
    var tbody = document.getElementById('warden-payments-tbody');
    tbody.innerHTML = '';
    this.pendingPaymentVerifications = {};
    var self = this;

    if (!payments || payments.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:24px; color:var(--text-muted);">No payment receipts submitted for reconciliation.</td></tr>';
      return;
    }

    payments.forEach(function (p) {
      self.pendingPaymentVerifications[p.PaymentID] = {
        paymentId: p.PaymentID,
        status: p.Status || 'PENDING',
        remarks: p.Remarks || ''
      };

      var isVerified = (p.Status === 'VERIFIED');
      var isRejected = (p.Status === 'REJECTED');
      var isDD = (p.PaymentMode === 'DEMAND_DRAFT');

      var refDisplay = '<strong>' + p.TransactionReference + '</strong>';
      if (isDD) {
        var bankInfo = p.DDBankName ? (p.DDBankName + (p.DDBranchName ? (', ' + p.DDBranchName) : '')) : (p.Remarks || '');
        refDisplay = '<strong>DD #' + p.TransactionReference + '</strong>' + (bankInfo ? ('<br><small style="color:var(--text-muted);">' + bankInfo + '</small>') : '');
      }

      var tr = document.createElement('tr');
      tr.id = 'pay-row-' + p.PaymentID;
      tr.innerHTML =
        '<td>' + refDisplay + '</td>' +
        '<td>' + (p.StudentName || 'Student') + '<br><small style="color:var(--text-muted);">' + (p.EnrollmentNo || p.StudentID) + '</small></td>' +
        '<td><span class="badge badge-info">' + (p.AllocatedRoom || 'Allocated') + '</span></td>' +
        '<td><strong>INR ' + parseFloat(p.Amount || 0).toLocaleString() + '</strong></td>' +
        '<td><span class="badge ' + (isDD ? 'badge-primary' : 'badge-secondary') + '">' + (p.PaymentMode || 'DEMAND_DRAFT').replace(/_/g, ' ') + '</span></td>' +
        '<td>' + (p.PaymentDate || 'N/A') + '</td>' +
        '<td><span id="pay-badge-' + p.PaymentID + '" class="badge ' + (isVerified ? 'badge-success' : (isRejected ? 'badge-danger' : 'badge-warning')) + '">' + (isDD && !isVerified && !isRejected ? 'DD AWAITING HANDOVER' : p.Status) + '</span></td>' +
        '<td><div style="display:flex; gap:6px;">' +
        '<button type="button" id="btn-pay-verify-' + p.PaymentID + '" class="btn btn-sm ' + (isVerified ? 'btn-success' : 'btn-secondary') + '" onclick="App.setSinglePaymentStatus(\'' + p.PaymentID + '\', \'VERIFIED\')">' + (isDD ? '✓ Verify DD' : 'Verify') + '</button>' +
        '<button type="button" id="btn-pay-reject-' + p.PaymentID + '" class="btn btn-sm ' + (isRejected ? 'btn-danger' : 'btn-secondary') + '" onclick="App.setSinglePaymentStatus(\'' + p.PaymentID + '\', \'REJECTED\')">Reject</button>' +
        '</div></td>';
      tbody.appendChild(tr);
    });
  },

  setSinglePaymentStatus: function (paymentId, status) {
    if (!this.pendingPaymentVerifications[paymentId]) {
      this.pendingPaymentVerifications[paymentId] = { paymentId: paymentId };
    }
    this.pendingPaymentVerifications[paymentId].status = status;

    // Update UI badge
    var badge = document.getElementById('pay-badge-' + paymentId);
    if (badge) {
      badge.className = 'badge ' + (status === 'VERIFIED' ? 'badge-success' : (status === 'REJECTED' ? 'badge-danger' : 'badge-warning'));
      badge.textContent = status;
    }

    // Update Buttons styling
    var btnVerify = document.getElementById('btn-pay-verify-' + paymentId);
    var btnReject = document.getElementById('btn-pay-reject-' + paymentId);
    if (btnVerify && btnReject) {
      if (status === 'VERIFIED') {
        btnVerify.className = 'btn btn-sm btn-success';
        btnReject.className = 'btn btn-sm btn-secondary';
      } else if (status === 'REJECTED') {
        btnVerify.className = 'btn btn-sm btn-secondary';
        btnReject.className = 'btn btn-sm btn-danger';
      }
    }
  },

  setAllPaymentStatuses: function (status) {
    var self = this;
    for (var payId in this.pendingPaymentVerifications) {
      self.setSinglePaymentStatus(payId, status);
    }
  },

  saveAllPaymentVerifications: function () {
    var verifications = [];
    for (var payId in this.pendingPaymentVerifications) {
      verifications.push(this.pendingPaymentVerifications[payId]);
    }

    if (verifications.length === 0) {
      this.showToast('No payment records to update.', 'info');
      return;
    }

    var self = this;
    this.showLoading('Saving payment reconciliation statuses...');
    this.callServer('apiVerifyPaymentsBatch', this.token, verifications)
      .then(function () {
        self.hideLoading();
        self.showToast('All payment reconciliation statuses updated successfully.', 'success');
        self.loadWardenDashboard();
      })
      .catch(function () {
        self.hideLoading();
      });
  },

  openOverrideModal: function (allocId, currentHostelId) {
    document.getElementById('override-alloc-id').value = allocId;

    var alloc = (this.wardenData.allocations || []).filter(function (a) { return a.allocationId === allocId; })[0];
    var studentNameEl = document.getElementById('override-student-name');
    var currentRoomEl = document.getElementById('override-current-room');
    if (studentNameEl && alloc) {
      studentNameEl.textContent = alloc.studentName + ' (' + alloc.studentId + ')';
    }
    if (currentRoomEl && alloc) {
      currentRoomEl.textContent = 'Current: ' + alloc.hostelName + ' - Room ' + alloc.roomNumber + ' (Floor ' + alloc.floorNumber + ')';
    }

    // Reset action type to REASSIGN
    var radios = document.getElementsByName('override-action-type');
    for (var i = 0; i < radios.length; i++) {
      radios[i].checked = (radios[i].value === 'REASSIGN');
    }
    this.onOverrideActionChange('REASSIGN');

    var hostSelect = document.getElementById('override-hostel-select');
    hostSelect.innerHTML = '<option value="">-- Select Target Hostel --</option>';

    var hostels = this.wardenData.hostels || [];
    var allocGender = alloc ? alloc.gender : '';
    hostels.forEach(function (h) {
      if (!allocGender || (allocGender === 'MALE' && h.Gender === 'BOYS') || (allocGender === 'FEMALE' && h.Gender === 'GIRLS') || (h.Gender === allocGender)) {
        hostSelect.innerHTML += '<option value="' + h.HostelID + '">' + h.Name + ' (' + h.Code + ' - ' + h.Gender + ')</option>';
      }
    });

    hostSelect.value = currentHostelId;
    this.updateOverrideRoomsList(currentHostelId);
    document.getElementById('override-reason').value = '';
    this.loadSmritiOverridePrecedents(alloc, currentHostelId);
    this.openModal('modal-override');
  },

  loadSmritiOverridePrecedents: function (alloc, currentHostelId) {
    var container = document.getElementById('smriti-override-cases');
    if (!container) return;
    container.innerHTML = '<div style="display:flex; align-items:center; gap:8px;"><span class="spinner" style="width:14px; height:14px; border-width:2px;"></span> Recalling historical precedents...</div>';

    var ctx = {
      category: alloc ? alloc.category : '',
      priorityGroup: alloc ? alloc.priorityGroup : '',
      toHostel: currentHostelId || (alloc ? alloc.hostelId : '')
    };

    this.callServer('apiSmritiSuggestForOverride', this.token, ctx)
      .then(function (res) {
        if (!res || !res.cases || !res.cases.length) {
          container.innerHTML = '<div style="color:var(--text-muted); font-style:italic;">' +
            ((res && res.notice) ? res.notice : 'No matching historical override precedents found in institutional memory.') +
            '</div>';
          return;
        }

        var html = '';
        res.cases.forEach(function (c) {
          html += '<div class="smriti-case-item">⚖️ ' + App.renderMarkdown(c.content) + '</div>';
        });
        container.innerHTML = html;
      })
      .catch(function () {
        container.innerHTML = '<div style="color:var(--text-muted); font-style:italic;">Smriti advisory memory is currently offline.</div>';
      });
  },

  onOverrideActionChange: function (actionType) {
    var reassignFields = document.getElementById('override-reassign-fields');
    var cancelWarning = document.getElementById('override-cancel-warning');
    var submitBtn = document.getElementById('btn-submit-override');
    var modalTitle = document.getElementById('override-modal-title');

    if (actionType === 'CANCEL') {
      if (reassignFields) reassignFields.style.display = 'none';
      if (cancelWarning) cancelWarning.style.display = 'block';
      if (modalTitle) modalTitle.textContent = 'Revoke & Cancel Room Allocation';
      if (submitBtn) {
        submitBtn.textContent = '🚫 Confirm & Revoke Allocation';
        submitBtn.className = 'btn btn-danger';
      }
    } else {
      if (reassignFields) reassignFields.style.display = 'block';
      if (cancelWarning) cancelWarning.style.display = 'none';
      if (modalTitle) modalTitle.textContent = 'Manual Allocation Override';
      if (submitBtn) {
        submitBtn.textContent = 'Confirm & Apply Reassignment';
        submitBtn.className = 'btn btn-primary';
      }
    }
  },

  updateOverrideRoomsList: function (hostelId) {
    var roomSelect = document.getElementById('override-room-select');
    roomSelect.innerHTML = '<option value="">-- Select Target Room --</option>';
    var rooms = this.wardenData.rooms || [];
    var avail = rooms.filter(function (r) { return r.HostelID === hostelId && r.OccupancyStatus === 'AVAILABLE'; });

    avail.forEach(function (r) {
      roomSelect.innerHTML += '<option value="' + r.RoomID + '">Room ' + r.RoomNumber + ' (Floor ' + r.FloorNumber + ')</option>';
    });
  },

  submitManualOverride: function () {
    var allocId = document.getElementById('override-alloc-id').value;
    var reason = (document.getElementById('override-reason').value || '').trim();

    var actionType = 'REASSIGN';
    var radios = document.getElementsByName('override-action-type');
    for (var i = 0; i < radios.length; i++) {
      if (radios[i].checked) {
        actionType = radios[i].value;
        break;
      }
    }

    if (!reason || reason.length < 5) {
      this.showToast('Please specify a valid administrative justification reason (min 5 chars).', 'warning');
      return;
    }

    var self = this;

    if (actionType === 'CANCEL') {
      if (!confirm('Are you sure you want to officially CANCEL and REVOKE this candidate\'s room allotment? This will immediately free up their room.')) {
        return;
      }

      this.showLoading('Cancelling room allocation...');
      this.callServer('apiCancelAllocation', this.token, {
        allocationId: allocId,
        reason: reason
      })
        .then(function (res) {
          self.hideLoading();
          self.closeModal('modal-override');
          self.showToast('Allocation revoked successfully. Room is now available.', 'success');
          self.loadWardenDashboard();
        })
        .catch(function () {
          self.hideLoading();
        });
      return;
    }

    // Otherwise REASSIGN
    var hostelId = document.getElementById('override-hostel-select').value;
    var roomId = document.getElementById('override-room-select').value;

    if (!hostelId || !roomId) {
      this.showToast('Please select target hostel and available room.', 'warning');
      return;
    }

    this.showLoading('Applying manual room reassignment...');
    this.callServer('apiOverrideAllocation', this.token, {
      allocationId: allocId,
      newHostelId: hostelId,
      newRoomId: roomId,
      reason: reason
    })
      .then(function (res) {
        self.hideLoading();
        self.closeModal('modal-override');
        self.showToast('Allocation reallocated successfully to Room ' + res.newRoom, 'success');
        self.loadWardenDashboard();
      })
      .catch(function () {
        self.hideLoading();
      });
  },

  movePriorityRuleUp: function (index) {
    if (index <= 0 || index >= this.currentPriorityRules.length) return;
    var temp = this.currentPriorityRules[index];
    this.currentPriorityRules[index] = this.currentPriorityRules[index - 1];
    this.currentPriorityRules[index - 1] = temp;

    // Re-assign ranks 1..N
    for (var i = 0; i < this.currentPriorityRules.length; i++) {
      this.currentPriorityRules[i].OrderRank = (i + 1);
    }
    this.renderWardenPriorityRules(this.currentPriorityRules);
    this.showToast('Priority rank moved. Click "Save Priority Order" to apply.', 'info');
  },

  movePriorityRuleDown: function (index) {
    if (index < 0 || index >= this.currentPriorityRules.length - 1) return;
    var temp = this.currentPriorityRules[index];
    this.currentPriorityRules[index] = this.currentPriorityRules[index + 1];
    this.currentPriorityRules[index + 1] = temp;

    // Re-assign ranks 1..N
    for (var i = 0; i < this.currentPriorityRules.length; i++) {
      this.currentPriorityRules[i].OrderRank = (i + 1);
    }
    this.renderWardenPriorityRules(this.currentPriorityRules);
    this.showToast('Priority rank moved. Click "Save Priority Order" to apply.', 'info');
  },

    var html = '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">' +
      '<div><h4 style="margin:0; font-size:15px; color:var(--text-main);">' + app.name + ' (' + app.applicationId + ')</h4>' +

      '<div style="display:flex; gap:8px;">' +

    docs.forEach(function (d) {
      self.pendingDocVerifications[d.DocumentID] = {
        documentId: d.DocumentID,
        status: d.VerificationStatus || 'PENDING',
        remarks: d.Remarks || ''
      };

      var isVerified = (d.VerificationStatus === 'VERIFIED');
      var isRejected = (d.VerificationStatus === 'REJECTED');

      html +=
        '<div id="doc-card-' + d.DocumentID + '" style="padding:14px; border:1px solid var(--border); border-radius:8px; margin-bottom:12px; background:var(--bg-card);">' +
        '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">' +
        '<strong style="font-size:14px;">' + d.DocumentType.replace(/_/g, ' ') + '</strong>' +
        '<span id="doc-badge-' + d.DocumentID + '" class="badge ' + (isVerified ? 'badge-success' : (isRejected ? 'badge-danger' : 'badge-warning')) + '">' + (d.VerificationStatus || 'PENDING') + '</span>' +
        '</div>' +
        '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">' +
        '<a href="' + d.DriveURL + '" target="_blank" class="btn btn-sm btn-secondary" style="font-size:12px;">📂 Open in Drive</a>' +
        '<div style="display:flex; gap:8px;">' +
        '<button type="button" id="btn-approve-' + d.DocumentID + '" class="btn btn-sm ' + (isVerified ? 'btn-success' : 'btn-secondary') + '" onclick="App.setSingleDocStatus(\'' + d.DocumentID + '\', \'VERIFIED\')">Approve</button>' +
        '<button type="button" id="btn-reject-' + d.DocumentID + '" class="btn btn-sm ' + (isRejected ? 'btn-danger' : 'btn-secondary') + '" onclick="App.setSingleDocStatus(\'' + d.DocumentID + '\', \'REJECTED\')">Reject</button>' +
        '</div>' +
        '</div>' +
        '</div>';
    });

    container.innerHTML = html;
    this.openModal('modal-verify-docs');

  setSingleDocStatus: function (docId, status) {
    if (!this.pendingDocVerifications[docId]) {
      this.pendingDocVerifications[docId] = { documentId: docId };
    }
    this.pendingDocVerifications[docId].status = status;

    // Update UI badge
    var badge = document.getElementById('doc-badge-' + docId);
    if (badge) {
      badge.className = 'badge ' + (status === 'VERIFIED' ? 'badge-success' : (status === 'REJECTED' ? 'badge-danger' : 'badge-warning'));
      badge.textContent = status;
    }

    // Update Button styling
    var btnApprove = document.getElementById('btn-approve-' + docId);
    var btnReject = document.getElementById('btn-reject-' + docId);
    if (btnApprove && btnReject) {
      if (status === 'VERIFIED') {
        btnApprove.className = 'btn btn-sm btn-success';
        btnReject.className = 'btn btn-sm btn-secondary';
      } else if (status === 'REJECTED') {
        btnApprove.className = 'btn btn-sm btn-secondary';
        btnReject.className = 'btn btn-sm btn-danger';
      }
    }
  },

  setAllDocStatuses: function (status) {
    var self = this;
    for (var docId in this.pendingDocVerifications) {
      self.setSingleDocStatus(docId, status);
    }
  },

  saveAllDocumentVerifications: function () {
    var verifications = [];
    for (var docId in this.pendingDocVerifications) {
      verifications.push(this.pendingDocVerifications[docId]);
    }

    if (verifications.length === 0) {
      this.closeModal('modal-verify-docs');
      return;
    }

    var self = this;
    this.showLoading('Saving document verification statuses...');
    this.callServer('apiVerifyDocumentsBatch', this.token, verifications)
      .then(function () {
        self.hideLoading();
        self.closeModal('modal-verify-docs');
        self.showToast('All document statuses updated successfully.', 'success');
        self.loadWardenDashboard();
      })
      .catch(function () {
        self.hideLoading();
      });

  verifyPayment: function (paymentId, status) {
    var remarks = prompt('Enter payment remarks:') || '';
    var self = this;
    this.showLoading('Verifying payment...');
    this.callServer('apiVerifyPayment', this.token, paymentId, status, remarks)
      .then(function () {
        self.hideLoading();
        self.showToast('Payment marked as ' + status, 'success');
        self.loadWardenDashboard();

    var self = this;
    this.showLoading('Generating CSV report...');
    this.callServer('apiGetReports', this.token, reportType, null)
      .then(function (report) {
        self.hideLoading();
        var blob = new Blob([report.csv], { type: 'text/csv;charset=utf-8;' });
        var link = document.createElement('a');
        var url = URL.createObjectURL(blob);
        link.setAttribute('href', url);

        document.body.appendChild(link);
        link.click();

  openHostelResidentsModal: function (hostelId, hostelName) {
    var titleEl = document.getElementById('hostel-residents-modal-title');
    var subEl = document.getElementById('hostel-residents-modal-sub');
    var countEl = document.getElementById('hostel-residents-count');
    var tbody = document.getElementById('hostel-residents-tbody');
    tbody.innerHTML = '';

    if (titleEl) titleEl.textContent = '👥 ' + (hostelName || 'Hostel') + ' Residents';
    if (subEl) subEl.textContent = 'Allocated students currently residing in ' + (hostelName || 'this residence');

    var allocations = (this.wardenData && this.wardenData.allocations) ? this.wardenData.allocations : [];
    var residents = allocations.filter(function (al) {
      return al.hostelId === hostelId && al.status !== 'CANCELLED' && al.status !== 'LAPSED_UNREPORTED';
    });

    residents.sort(function (a, b) {
      var flA = parseInt(a.floorNumber, 10) || 0;
      var flB = parseInt(b.floorNumber, 10) || 0;
      if (flA !== flB) return flA - flB;
      return String(a.roomNumber).localeCompare(String(b.roomNumber));
    });

    if (countEl) countEl.textContent = residents.length + ' Total Occupants';

    if (residents.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:24px; color:var(--text-muted);">No students currently allocated to this residence.</td></tr>';
    } else {
      residents.forEach(function (r) {
        var isCheckedIn = (r.registrationStatus === 'COMPLETED');
        var checkInBadge = isCheckedIn ?
          '<span class="badge badge-success">✓ CHECKED-IN</span>' :
          '<button class="btn btn-sm btn-outline-success" onclick="App.markPhysicalRegistration(\'' + r.allocationId + '\', \'' + (r.studentName || 'Student').replace(/'/g, "\\'") + '\')">🔑 Check-In / Key</button>';

        var feeBadge = r.hasVerifiedPayment ?
          '<span class="badge badge-success">✓ VERIFIED</span>' :
          (r.hasSubmittedPayment ? '<span class="badge badge-warning">⏳ AWAITING VERIFY</span>' : '<span class="badge badge-danger">PENDING FEE</span>');

        var genderText = (String(r.gender).toUpperCase() === 'MALE') ? 'Male' : 'Female';

        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong>Room ' + r.roomNumber + '</strong><br><small style="color:var(--text-muted);">Floor ' + r.floorNumber + '</small></td>' +
          '<td><strong>' + r.studentName + '</strong></td>' +
          '<td><code>' + r.studentId + '</code></td>' +
          '<td>' + genderText + '</td>' +
          '<td><span class="badge badge-info">' + (r.category || 'GENERAL') + '</span></td>' +
          '<td>' + (r.priorityGroup || 'N/A') + '</td>' +
          '<td>' + feeBadge + '</td>' +
          '<td>' + checkInBadge + '</td>';
        tbody.appendChild(tr);
      });
    }

    this.openModal('modal-hostel-residents');
  },

    if (!el) return;
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  },

  copySmritiResponse: function (btn, text) {
    if (!text && btn) {
      var parentBubble = btn.closest('.smriti-msg-bubble');
      if (parentBubble) {
        var contentEl = parentBubble.querySelector('.smriti-msg-content');
        if (contentEl) text = contentEl.innerText || contentEl.textContent;
      }
    }
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text);
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    if (btn) {
      var oldHtml = btn.innerHTML;
      btn.innerHTML = '<span style="color:var(--success); font-weight:600;">✓ Copied</span>';
      setTimeout(function () {
        btn.innerHTML = oldHtml;
      }, 2000);
    }
  },

    var input = document.getElementById('smriti-chat-input');
    if (input) {
      input.value = question;
      this.autoGrowSmritiInput(input);

    this.submitSmritiQuestion();

  submitSmritiQuestion: function () {

    // 1. Append User Message

      '</div>' +
      '</div>';

    // 2. Append Pending Assistant Bubble
    var tempMsgId = 'smriti-loading-' + Date.now();
    var pendingMsgHtml = '<div id="' + tempMsgId + '" class="smriti-msg-row smriti-msg-assistant">' +
      '<div class="smriti-msg-avatar">' +

            '<div class="smriti-msg-author">' +
            '<span class="smriti-author-name">Smriti</span>' +
            '<span class="smriti-author-role">Hindsight Memory</span>' +

            '</div>' +
            '</div>';
        }
        history.scrollTop = history.scrollHeight;
      })
      .catch(function () {
        if (sendBtn) sendBtn.disabled = false;
        if (sendIcon) sendIcon.style.display = 'inline-block';
        if (sendSpinner) sendSpinner.style.display = 'none';
        if (sendLabel) sendLabel.textContent = 'Ask Smriti';

        var tempEl = document.getElementById(tempMsgId);

        if (tempEl) {

            '<div class="smriti-msg-content" style="color:var(--text-muted); font-style:italic;">' +
            App.renderMarkdown(friendlyErr) +
            '</div>' +
            '</div>';
        }
        history.scrollTop = history.scrollHeight;
      });
  },

  loadSmritiPrePublishBriefing: function () {
    var card = document.getElementById('smriti-prepublish-card');
    var content = document.getElementById('smriti-briefing-content');
    if (!card || !content) return;

    card.style.display = 'block';
    content.innerHTML = '<div style="display:flex; align-items:center; gap:8px;"><span class="spinner" style="width:14px; height:14px; border-width:2px;"></span> Synthesizing historical cycle warnings and waitlist trends...</div>';

    this.callServer('apiSmritiPrePublishBriefing', this.token)
      .then(function (res) {
        var briefing = (res && res.briefing) ? res.briefing : 'Smriti advisory memory is offline.';
        content.innerHTML = App.renderMarkdown(briefing);
      })
      .catch(function () {
        content.innerHTML = '<span style="color:var(--text-muted); font-style:italic;">Smriti briefing unavailable (offline mode). Allocation engine validation remains fully verified.</span>';
      });
  },

  dismissSmritiBriefing: function () {
    var card = document.getElementById('smriti-prepublish-card');
    if (card) card.style.display = 'none';
  },

  showLoading: function (msg) {
    var overlay = document.getElementById('loading-overlay');
    if (overlay) {
      overlay.style.display = 'flex';
      var textEl = document.getElementById('loading-text');
      if (textEl) textEl.textContent = msg || 'Processing...';
    }
  },

  hideLoading: function () {
    var overlay = document.getElementById('loading-overlay');
    if (overlay) overlay.style.display = 'none';
  }
};

window.onload = function () {
  App.init();
};
</script>
