<div id="view-warden-login" class="view-container" style="display:none; max-width:440px; margin:40px auto;">
  <div class="card" style="padding:32px; border-top:4px solid var(--primary);">
    <div style="text-align:center; margin-bottom:24px;">
      <div class="nav-logo-icon" style="margin:0 auto 12px auto; width:48px; height:48px; font-size:22px; background:linear-gradient(135deg, #0f172a, #1e3a8a);">🛡️</div>
      <h2 style="font-size:22px; font-weight:800; color:var(--text-main);">Warden / Admin Portal</h2>
      <p style="font-size:13px; color:var(--text-muted); margin-top:4px;">Hostel Administration & Rule-Based Allocation Control</p>
    </div>

    <form onsubmit="event.preventDefault(); App.login(document.getElementById('warden-login-email').value, document.getElementById('warden-login-password').value);">
      <div class="form-group">
        <label class="form-label" for="warden-login-email">Administrative Email</label>
        <input type="email" id="warden-login-email" class="form-control" placeholder="warden.demo@hostel360.test" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="warden-login-password">Administrative Password</label>
        <input type="password" id="warden-login-password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">Sign In to Administration Console</button>
    </form>

    <!-- Warden Demo Credentials Info Box -->
    <div style="background:var(--bg-subtle); padding:14px 16px; border-radius:var(--radius-sm); border:1px solid var(--border); margin-top:20px; font-size:13px;">
      <div style="font-weight:700; color:var(--text-main); margin-bottom:6px; display:flex; align-items:center; gap:6px;">
        <span>⚡</span> Demo Warden Credentials
      </div>
      <div style="color:var(--text-muted); line-height:1.6;">
        Email: <code style="color:var(--primary); font-weight:600;">warden.demo@hostel360.test</code><br>
        Password: <code style="color:var(--primary); font-weight:600;">Warden@123</code>
      </div>
    </div>

    <div style="text-align:center; margin-top:20px; font-size:13px;">
      <a href="javascript:void(0)" onclick="App.navigate('landing')" style="color:var(--accent); text-decoration:none; font-weight:600; display:inline-flex; align-items:center; gap:6px;">
        &larr; Back to Home / Change Role
      </a>
    </div>
  </div>
</div>
